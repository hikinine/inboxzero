name: golive — Build & Deploy

# Push na main que mexa no golive → builda apps/golive/Dockerfile, publica no
# ghcr.io e dispara o deploy no Dokploy (cloud.codehall.io) pelo webhook do app.
on:
  push:
    branches: [main]
    paths:
      - apps/golive/**
      - .github/workflows/golive.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: golive-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/golive/Dockerfile
          # O host do Dokploy é amd64.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hikinine/golive:production
            ghcr.io/hikinine/golive:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=golive
          cache-to: type=gha,mode=max,scope=golive

      - name: Deploy no Dokploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_GOLIVE_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DOKPLOY_GOLIVE_WEBHOOK não configurado — a imagem subiu, mas o deploy não foi disparado."
            exit 0
          fi
          curl -fsS --retry 5 --retry-all-errors --retry-delay 10 -X POST "$WEBHOOK"
