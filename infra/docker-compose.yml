services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasky
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Postgres dedicado ao catálogo (apps/catalog) — isolado do banco do tasky.
  catalog-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalog
    ports:
      - "5434:5432"
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data

  # Postgres dedicado ao email-checker (apps/email-checker) — isolado dos demais.
  email-checker-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: email_checker
    ports:
      - "5435:5432"
    volumes:
      - email_checker_postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  catalog_postgres_data:
  email_checker_postgres_data:
